<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Technical grid circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Dial calibration ticks -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="56" x2="256" y2="76"/>
    <line x1="456" y1="256" x2="436" y2="256"/>
    <line x1="256" y1="456" x2="256" y2="436"/>
    <line x1="56" y1="256" x2="76" y2="256"/>
    <line x1="397" y1="115" x2="383" y2="129"/>
    <line x1="115" y1="397" x2="129" y2="383"/>
    <line x1="397" y1="397" x2="383" y2="383"/>
    <line x1="115" y1="115" x2="129" y2="129"/>
  </g>

  <!-- Hexagonal electric badge -->
  <polygon points="256,110 376,180 376,320 256,390 136,320 136,180" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>

  <!-- High-voltage Lightning Bolt -->
  <path d="M280 135 L175 275 L245 275 L225 385 L345 235 L275 235 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- REBT Engineering Badge text -->
  <text x="256" y="435" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="6">REBT PRO</text>
</svg>
